; wM-Buster ADV — PlatformIO configuration
; Target: M5Stack Cardputer-Adv (ESP32-S3FN8, no PSRAM) + Cap LoRa-1262 (SX1262)

[platformio]
default_envs = m5stack-cardputer-adv

[env:m5stack-cardputer-adv]
platform = espressif32@6.10.0
board = m5stack-stamps3
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Flash configuration (8MB flash, no PSRAM)
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM=0
    -D CORE_DEBUG_LEVEL=3
    -I include

lib_deps =
    m5stack/M5Unified @ ^0.2.19
    m5stack/M5GFX @ ^0.2.26
    m5stack/M5Cardputer @ ^1.1.1
    jgromes/RadioLib @ ^7.7.1
    https://github.com/m5stack/TinyGPSPlus.git
    knolleary/PubSubClient @ ^2.8

; -------------------------------------------------------------------------
; Host-based unit tests — Core decode/phy logic should run natively on Host
; -------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -I include
    -D NATIVE_TEST
    -D UNITY_INCLUDE_DOUBLE
    -std=gnu++17
build_src_filter =
    +<*>
    -<main.cpp>
    -<ui/>
    -<net/>
    -<config/>
test_build_src = true
lib_deps =
